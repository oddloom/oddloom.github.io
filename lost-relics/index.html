<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Lost Relics</title>
<meta name="description" content="Combine joias num templo perdido. 20 fases, dinamite, barris de pólvora e o ídolo dourado.">
<link rel="icon" href="assets/icon-192.png">
<link rel="apple-touch-icon" href="assets/icon-512.png">
<meta name="theme-color" content="#0a0907">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Uncial+Antiqua&family=Spectral:ital,wght@0,500;0,600;1,500&display=swap">
<link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600,700&display=swap">
<link rel="stylesheet" href="style.css">
<meta property="og:title" content="Lost Relics">
<meta property="og:description" content="Combine joias num templo maia perdido. 20 fases, grátis, no navegador.">
<meta property="og:image" content="https://oddloom.github.io/img/thumb-lost-relics.jpg">
<meta name="twitter:card" content="summary_large_image">
<script async src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-6743099408388533" crossorigin="anonymous"></script>
<script>
  window.ADS_CONFIG = { client: '' }; /* anúncio simulado até o AdSense aprovar */
  window.adsbygoogle = window.adsbygoogle || [];
  window.adBreak = window.adConfig = function (o) { adsbygoogle.push(o); };
</script>
</head>
<body>
<canvas id="stage" aria-label="Tabuleiro de joias"></canvas>

<div id="hud" hidden>
  <button id="btnPause" class="icon-btn" type="button" aria-label="Pausa"><svg viewBox="0 0 20 20"><rect x="5" y="3" width="3.2" height="14" rx="1"/><rect x="11.8" y="3" width="3.2" height="14" rx="1"/></svg></button>
  <div class="hud-moves"><span class="lbl" data-t="moves"></span><span id="moves" class="metal">0</span></div>
  <div id="goals" class="hud-goals"></div>
  <div class="hud-score"><span class="lbl" data-t="score"></span><span id="score">0</span>
    <div class="starbar"><div id="starfill"></div><img id="mk1" alt=""><img id="mk2" alt=""><img id="mk3" alt=""></div>
  </div>
</div>

<button id="btnHammer" class="tool-btn" type="button" hidden aria-label="Martelo"><img id="hammerIc" alt=""><b id="hammerCount">×0</b></button>

<section id="screen-menu" class="screen" hidden>
  <h1 class="logo-wrap"><img id="logo" src="assets/logo.png" alt="Lost Relics"></h1>
  <p class="tagline" data-t="title.sub"></p>
  <div class="menu-buttons">
    <button id="btnPlay" class="btn" type="button"></button>
  </div>
  <div class="menu-toggles">
    <button id="btnSfx" class="icon-btn toggle" type="button" aria-label="Som"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 9.5h3.5L12 5v14l-5.5-4.5H3z" stroke-linejoin="round" stroke-width="1"/><path class="wave" d="M15.5 9.2a4 4 0 0 1 0 5.6" fill="none" stroke-width="2.2" stroke-linecap="round"/><path class="wave" d="M18 6.6a7.6 7.6 0 0 1 0 10.8" fill="none" stroke-width="2.2" stroke-linecap="round"/><path class="slash" d="M3.5 3.5l17 17" fill="none" stroke-width="2.6" stroke-linecap="round"/></svg></button>
    <button id="btnMusic" class="icon-btn toggle" type="button" aria-label="Música"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 17.5V6l10-2v11.5"/><circle cx="6.5" cy="17.5" r="2.8"/><circle cx="16.5" cy="15.5" r="2.8"/><path class="slash" d="M4 4l16 16" fill="none" stroke-width="2.4" stroke-linecap="round"/></svg></button>
    <button id="btnLang" class="btn dark small" type="button"></button>
  </div>
  <div class="menu-foot"><a href="../" style="color:inherit;text-decoration:none">ODDLOOM GAMES</a></div>
</section>

<section id="screen-map" class="screen" hidden>
  <header class="map-head">
    <button id="btnMapBack" class="icon-btn" type="button" aria-label="Menu"><svg viewBox="0 0 20 20"><path d="M12.5 3 5.5 10l7 7 1.6-1.6L8.7 10l5.4-5.4z"/></svg></button>
    <div class="map-title"><small data-t="map.world"></small><strong class="metal" data-t="map.title"></strong><em data-t="map.sub"></em><span class="map-stars"><img id="mapStarIc" alt=""><span id="mapStars">0/60</span></span></div>
    <button id="btnShop" class="coin-pill" type="button"><img id="mapCoinIc" alt=""><span id="mapCoins">0</span><i>+</i></button>
  </header>
  <div id="mapScroll"><div id="mapInner"></div></div>
</section>

<div id="wipe" aria-hidden="true"></div>
<div id="modal" class="modal" hidden><div id="modalCard" class="card" role="dialog" aria-modal="true"></div></div>
<div id="loading" class="loading">…</div>

<script src="i18n.js"></script>
<script src="ads.js"></script>
<script src="sound.js"></script>
<script src="engine.js"></script>
<script src="levels.js"></script>
<script src="textures.js"></script>
<script src="gems3d.js"></script>
<script src="art-data.js"></script>
<script src="audio-data.js"></script>
<script src="art.js"></script>
<script src="ui-art.js"></script>
<script src="game.js"></script>
</body>
</html>
